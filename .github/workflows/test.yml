name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip unit tests (lint, type-check, pytest)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Unit tests — fast, no Docker, no API keys
  # ---------------------------------------------------------------
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/clawgraph/ --ignore-missing-imports

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest --tb=short -q

  # ---------------------------------------------------------------
  # LobsterGym — build mock containers & validate they start
  # ---------------------------------------------------------------
  lobstergym-build:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build lobstergym-web image
        run: docker build -t lobstergym-web lobstergym/web/

      - name: Build lobstergym-api image
        run: docker build -t lobstergym-api lobstergym/api/

      - name: Smoke-test lobstergym-web
        run: |
          docker run -d --name web-test -p 8080:8080 lobstergym-web
          sleep 3
          curl -sf http://localhost:8080/health
          docker stop web-test

      - name: Smoke-test lobstergym-api
        run: |
          docker run -d --name api-test -p 8090:8090 lobstergym-api
          sleep 3
          curl -sf http://localhost:8090/health
          docker stop api-test
